<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">ScratchPOS layout</title>
  <desc id="desc">Schematic of the three-pane order screen: price filters, ticket tiles, cart.</desc>
  <style>
    .bg { fill: #f7f1e6; }
    .panel { fill: #fffdf8; stroke: #e4d8c2; }
    .red { fill: #9b1b30; }
    .gold { fill: #e8b838; }
    .teal { fill: #1d6a7a; }
    .ink { fill: #1a1423; font: 600 16px "Segoe UI", "Helvetica Neue", sans-serif; }
    .small { fill: #6a5d50; font: 400 13px "Segoe UI", "Helvetica Neue", sans-serif; }
    .white { fill: #fff7e8; font: 600 13px "Segoe UI", "Helvetica Neue", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161118; }
      .panel { fill: #221c24; stroke: #322833; }
      .ink { fill: #f4ead8; }
      .small { fill: #b5a48f; }
    }
  </style>
  <rect class="bg" width="980" height="420" rx="20"/>

  <rect class="panel" x="24" y="48" width="160" height="348" rx="12"/>
  <text class="ink" x="44" y="80">Price filter</text>
  <rect class="red" x="40" y="100" width="128" height="36" rx="6"/>
  <text class="white" x="72" y="123">NT 2000</text>
  <rect class="red" x="40" y="148" width="128" height="36" rx="6"/>
  <text class="white" x="72" y="171">NT 1000</text>
  <rect class="red" x="40" y="196" width="128" height="36" rx="6"/>
  <text class="white" x="78" y="219">NT 500</text>
  <text class="small" x="40" y="270">Lab 5 menu</text>

  <rect class="panel" x="200" y="48" width="430" height="348" rx="12"/>
  <text class="ink" x="220" y="80">Fictional tickets</text>
  <rect class="red" x="220" y="104" width="180" height="110" rx="10"/>
  <rect class="gold" x="236" y="120" width="54" height="18" rx="4"/>
  <rect class="teal" x="416" y="104" width="180" height="110" rx="10"/>
  <rect class="gold" x="432" y="120" width="54" height="18" rx="4"/>
  <rect class="red" x="220" y="230" width="180" height="110" rx="10"/>
  <rect class="teal" x="416" y="230" width="180" height="110" rx="10"/>
  <text class="small" x="220" y="372">Generated by tools/make_demo_cards.py</text>

  <rect class="panel" x="646" y="48" width="310" height="348" rx="12"/>
  <text class="ink" x="666" y="80">Cart / checkout</text>
  <rect x="666" y="104" width="270" height="28" fill="#f0e6d2"/>
  <rect x="666" y="140" width="270" height="28" fill="#f0e6d2"/>
  <rect x="666" y="176" width="270" height="28" fill="#f0e6d2"/>
  <rect class="gold" x="666" y="232" width="80" height="40" rx="6"/>
  <rect class="red" x="756" y="232" width="80" height="40" rx="6"/>
  <rect class="teal" x="846" y="232" width="90" height="40" rx="6"/>
  <text class="small" x="666" y="310">Writes sale_order + order_detail</text>
  <text class="small" x="666" y="332">Refresh analysis afterwards</text>
</svg>
